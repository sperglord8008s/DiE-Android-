[package]
name = "die-binwalk-core"
version = "3.1.1"
edition = "2024"
license = "MIT"

# Compile the unmodified upstream library entry point. The desktop CLI, terminal
# UI and plotting/browser-download dependencies are outside this source target.
[lib]
name = "binwalk"
path = "../../vendor/Binwalk/src/lib.rs"

[dependencies]
log = "0.4.22"
base64 = "0.22.1"
chrono = "0.4.38"
walkdir = "2.5.0"
crc32-v2 = "0.0.5"
crc32c = "0.6.8"
liblzma = "0.4.2"
bzip2 = "0.6.0"
serde_json = "1.0"
flate2 = "1.1.2"
adler32 = "1.2.0"
md5 = "0.8.0"
miniz_oxide = "0.8.0"
aho-corasick = "1.1.3"
serde = { version = "1.0", features = ["derive"] }
xxhash-rust = { version = "0.8.12", features = ["xxh32"] }
hex = "0.4.3"
delink = { git = "https://github.com/devttys0/delink", rev = "b58c93732c3578af08d39d2fc2aeaada5b1c3ee1" }
uuid = { version = "1.17.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
