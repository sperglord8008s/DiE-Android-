plugins { id 'com.android.application' }
def nativeEnabled = providers.gradleProperty('withCdie').orElse('true').get().toBoolean()
android {
    namespace 'org.diemobile'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.diemobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha'
        if (nativeEnabled) {
            ndk { abiFilters 'arm64-v8a' }
            externalNativeBuild { cmake { targets 'diemobile' } }
        }
    }
    if (nativeEnabled) {
        externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
        sourceSets { main { assets.srcDir '../generated-assets' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
