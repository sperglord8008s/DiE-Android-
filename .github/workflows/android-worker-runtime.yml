name: Android worker runtime contracts
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main', 'codex/**']
permissions:
  contents: read
jobs:
  isolated-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    env:
      RESOURCE_DEPS_DIR: ${{ github.workspace }}/.ci-cache/resources
      ARCHIVE_DEPS_DIR: ${{ github.workspace }}/.ci-cache/archive
      RUNTIME_EXPECTED_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: worker-runtime-inputs-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-engine.sh', 'scripts/fetch-resources.sh', 'scripts/fetch-archive.sh', 'archive-engine/source-lock.json', 'resource-engine/build.gradle') }}
          restore-keys: worker-runtime-inputs-v1-${{ runner.os }}-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: bash scripts/fetch-engine.sh
      - name: Check offline owned fixtures
        run: python3 tests/test-media-preview-fixture.py
      - run: ./gradlew --no-daemon :runtime-worker:assembleDebug :runtime-worker:assembleDebugAndroidTest
      - run: python3 scripts/verify-worker-runtime.py
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Pinned v2 action; build-only Apache-2.0 dependency, not bundled in the app.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/run-worker-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-worker-runtime-api-${{ matrix.api }}
          if-no-files-found: warn
          path: |
            runtime-worker/build/runtime-build.json
            runtime-worker/build/runtime-results/
            runtime-worker/build/outputs/apk/
